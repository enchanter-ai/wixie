name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-checks:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: bash -n on .sh files
        run: |
          set -e
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find . -name "*.sh" -not -path "./node_modules/*" -print0)

      - name: jq syntax on .json files
        run: |
          set -e
          while IFS= read -r -d '' f; do jq -e . "$f" > /dev/null; done < <(find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -print0)

      - name: Python syntax check
        run: |
          set -e
          while IFS= read -r -d '' f; do python3 -m py_compile "$f"; done < <(find . -name "*.py" -not -path "./node_modules/*" -print0)

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: syntax-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      # WIX-CI-001: the suite is invoked explicitly through bash -- never gated on the executable
      # bit (every tracked file is 100644 and core.filemode=false, so an `-x` check was always
      # false on the runner and silently skipped the whole suite while reporting green). The step
      # fails if run-all.sh is missing, cannot start, or exits non-zero, and requires positive
      # evidence that tests ran: the WIXIE_SUITE_SUMMARY line with total > 0.
      - name: Run shell suite (bash tests/run-all.sh)
        env:
          WIXIE_TEST_ROOT: ${{ runner.temp }}/wixie-test-root
          WIXIE_SUITE_SUMMARY_FILE: ${{ runner.temp }}/wixie-suite-summary.txt
          WIXIE_EFFICACY_CLAUDE_BIN: /nonexistent/claude
        run: |
          set -euo pipefail
          test -f tests/run-all.sh || { echo "::error::tests/run-all.sh is missing"; exit 1; }
          mkdir -p "$WIXIE_TEST_ROOT"
          rm -f "$WIXIE_SUITE_SUMMARY_FILE"
          bash tests/run-all.sh 2>&1 | tee "$RUNNER_TEMP/wixie-suite.log"
          summary="$(grep -E '^WIXIE_SUITE_SUMMARY total=[0-9]+ passed=[0-9]+ failed=[0-9]+$' "$RUNNER_TEMP/wixie-suite.log" | tail -n 1 || true)"
          [ -n "$summary" ] || { echo "::error::run-all.sh printed no WIXIE_SUITE_SUMMARY line"; exit 1; }
          [ "$summary" = "$(cat "$WIXIE_SUITE_SUMMARY_FILE")" ] || { echo "::error::summary file does not match the printed summary"; exit 1; }
          total="$(printf '%s\n' "$summary" | sed -E 's/.* total=([0-9]+) .*/\1/')"
          failed="$(printf '%s\n' "$summary" | sed -E 's/.* failed=([0-9]+)$/\1/')"
          [ "$total" -gt 0 ] || { echo "::error::suite executed 0 tests"; exit 1; }
          [ "$failed" -eq 0 ] || { echo "::error::$failed test(s) failed"; exit 1; }
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
