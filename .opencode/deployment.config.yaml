# ═══════════════════════════════════════════════════════════════════════════════
# USAGE EXAMPLES FOR SCRIPTS & CONDUCT MODULES
# ═══════════════════════════════════════════════════════════════════════════════

usage_examples: |
  # Python (YAML loader)
  import yaml

  with open('.opencode/deployment.config.yaml') as f:
      config = yaml.safe_load(f)

  context_window = config['models']['local']['qwen_3_5_27b']['context_window']
  # → 102400

  port = config['models']['local']['qwen_3_5_27b']['port']
  # → 1234

  vram_min_gb = config['models']['local']['gamma_4_24b']['vram_requirements']['recommended'].split()[0]
  # → "8GB"

  server_url = config['inference_endpoints']['local_vlmm']['base_url']
  # → "http://localhost:8001/v1"

  # Shell / jq (for scripts)
  yq eval '.models.local.qwen_3_5_27b.context_window' .opencode/deployment.config.yaml
  # → 102400

  yq eval '.models.local.gamma_4_24b.port' .opencode/deployment.config.yaml
  # → 8001

  # Conduct module reference (in shared/conduct/xxx.md)
  # "Qwen 3.5-27B (context_window: 102K per .opencode/deployment.config.yaml)"
  # "Use port 1234 for LMStudio endpoint (per deployment.config.yaml)"
  # "VRAM: 16.8GB Q4_K_M (see deployment.config.yaml for full precision specs)"
