# QUICK REFERENCE & USAGE GUIDE
# ═══════════════════════════════════════════════════════════════════════════════

quick_reference:
  local_models:
    - "qwen_3_5_27b: 102K context, port 1234, Sonnet-tier, LMStudio, 16.8GB (Q4_K_M)"
    - "gamma_4_24b: 16K context, port 8001, Haiku-tier, vLLM, 4GB (AWQ)"

  cloud_fallback:
    - "claude_opus_4_8: 1M context, adaptive-thinking, $5M/$25M, prod failover"
    - "claude_sonnet_4_6: 200K context, standard, $3M/$15M, secondary fallover"
    - "claude_haiku_4_5: 200K context, standard, $0.80M/$4M, cost-sensitive"

  orchestration:
    - "plan_agent → qwen_3_5_27b:1234 (decomposition, feasibility)"
    - "build_agent → qwen_3_5_27b:1234 (conduct selection, formatting)"
    - "verify_agent → gamma_4_24b:8001 (5-axis scoring)"

  vram_minimums:
