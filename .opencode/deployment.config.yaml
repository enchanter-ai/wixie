    - "gamma_4_24b: 4GB (AWQ/GPTQ), 12GB (BF16)"

  frameworks:
    - "LMStudio 0.14.13 (desktop LLM runner for Qwen)"
    - "vLLM 0.21.0 (high-perf batch inference for Gamma)"
    - "Anthropic SDK 1.31.0 (Claude API client, fallback)"

  health_endpoints:
    - "http://localhost:1234/health (LMStudio)"
    - "http://localhost:8001/health (vLLM)"

  models_endpoints:
    - "http://localhost:1234/v1/models (list Qwen)"
    - "http://localhost:8001/v1/models (list Gamma)"

